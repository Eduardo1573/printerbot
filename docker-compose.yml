name: printerbot

services:
  bot:
    build:
      context: .
      target: runtime
    image: printerbot:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # SQLite file on the persistent "botdata" volume. Set DATABASE_URL in .env to use
      # PostgreSQL instead (postgresql+asyncpg://user:pass@host:5432/db).
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/printerbot.db}
    ports:
      # Scan-to-E-mail receiver (SCAN_MODE=email). Set SMTP_BIND_IP=10.8.0.1 (WireGuard
      # address) so it is reachable only through the tunnel. The default keeps it
      # local-only, which is right for eSCL / port-forwarding setups that don't use it.
      - "${SMTP_BIND_IP:-127.0.0.1}:${SMTP_PUBLISHED_PORT:-2525}:2525"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - botdata:/data
      - printtmp:/var/tmp/printerbot
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  botdata:
  printtmp:
